schema_version: 1

context:
  version: "1.5.0"

package:
  name: pypcd4
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pypcd4/pypcd4-${{ version }}.tar.gz
  sha256: 6e98dd1594499e18185d0675f66479b826bcfe19e9e93e176f710119bc96db74

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.21.0
    - python-neo-lzf >=0.3.5
    - pydantic >=1.10.8,<3.0.0

tests:
  - python:
      imports:
        - pypcd4
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Read and write PCL .pcd files in python
  license: BSD-3-Clause
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt
  homepage: https://github.com/MapIV/pypcd4

extra:
  recipe-maintainers:
    - tetov
